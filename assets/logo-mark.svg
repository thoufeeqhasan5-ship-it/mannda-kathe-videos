<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780" role="img" aria-label="Mannda Kathe logo: a paddy sprout rising from a mound of red coastal soil inside an arched frame" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- arched frame -->
  <path d="M60 740 V300 A240 240 0 0 1 540 300 V740 Z" fill="#1B110A" stroke="#E9A15B" stroke-width="28" stroke-linejoin="round"/>
  <!-- sea lines behind -->
