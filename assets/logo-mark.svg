  <path d="M130 680 h40 M250 660 h50 M380 690 h44" stroke="#8E3A1A" stroke-width="12" stroke-linecap="round"/>
  <!-- paddy sprout -->
  <path d="M300 600 V300" stroke="#8DBF4A" stroke-width="20" stroke-linecap="round"/>
  <path d="M300 520 C230 500 190 440 180 380 C250 390 290 440 300 520 Z" fill="#8DBF4A"/>
  <path d="M300 450 C370 430 410 370 420 310 C350 320 310 370 300 450 Z" fill="#8DBF4A"/>
  <!-- grains -->
  <g fill="#F0C060">
    <ellipse cx="300" cy="250" rx="20" ry="34"/>
    <ellipse cx="262" cy="282" rx="16" ry="28" transform="rotate(-30 262 282)"/>
    <ellipse cx="338" cy="282" rx="16" ry="28" transform="rotate(30 338 282)"/>
    <ellipse cx="250" cy="226" rx="14" ry="24" transform="rotate(-25 250 226)"/>
    <ellipse cx="350" cy="226" rx="14" ry="24" transform="rotate(25 350 226)"/>
  </g>
</svg>
